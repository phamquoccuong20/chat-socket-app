name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (NestJS + Prisma)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: server
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=chat_db;user=sa;password=Chat@123456;trustServerCertificate=true"
        run: npx prisma generate

      - name: Typecheck Server
        working-directory: server
        run: npx tsc --noEmit

      - name: Run Backend Unit Tests
        working-directory: server
        run: npm test -- --passWithNoTests --forceExit

      - name: Build Backend (NestJS)
        working-directory: server
        run: npm run build

      - name: Upload Backend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist/
          retention-days: 7

  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('client/package-lock.json') }}-${{ hashFiles('client/src/**/*.[jt]s', 'client/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('client/package-lock.json') }}-

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Typecheck Frontend
        working-directory: client
        run: npx tsc --noEmit

      - name: Build Frontend (Next.js)
        working-directory: client
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/.next/
          retention-days: 7

  docker-verification:
    name: Docker Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: chat-server:ci-check

      - name: Build Client Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: chat-client:ci-check

