version: '3.8'

services:
  # Database Service (Microsoft SQL Server 2022)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chat_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Chat@123456
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Chat@123456' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Backend Service (NestJS API & Socket.IO)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chat_server
    restart: always
    environment:
      - PORT=8000
      - DATABASE_URL=sqlserver://db:1433;database=chat_db;user=sa;password=Chat@123456;trustServerCertificate=true
    ports:
      - "8000:8000"
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (Next.js)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chat_client
    restart: always
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  sqlserver_data:
  server_uploads:
